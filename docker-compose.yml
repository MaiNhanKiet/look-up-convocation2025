version: '3.9'

services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: convocation2025_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=mongodb://kietmn:kietdeptrai123@143.198.84.82:17023/convocation2025?authSource=admin
      - DB_NAME=convocation2025
      - DB_BACHELOR_COLLECTION=bachelors
    ports:
      - '8080:8080'
    networks:
      - convocation2025
      - global_proxy_net

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api-admin.srofptuhcm.com
    container_name: convocation2025_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
    ports:
      - '3002:3002'
    networks:
      - convocation2025
      - global_proxy_net

volumes:
  mongo_data:


networks:
  convocation2025:
    driver: bridge
  global_proxy_net:
    external: true
    name: global_proxy_net
